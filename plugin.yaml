name: bot-forge
version: 0.12.1
description: Say "make me a <role>" and your Hermes agent builds a complete, working Bot — name, face, SOUL.md, memory, tools, skills, routines, Bot Chat and gateway — tested and rolled back on failure.
author: Bikash Joshi
license: MIT
homepage: https://github.com/BkashJEE/hermes-bot-forge
tags: [bots, bot-mode, profiles, agents, multi-agent, automation]
kind: standalone
requires_hermes: ">=0.21"
provides_tools:
  - create_agent
  - create_team
  - teach_agent
  - update_agent
  - copy_agent
  - list_agents
  - check_agents
  - check_install
  - agent_journal
  - ask_agent
  - share_agent
  - import_agent
  - hide_agent
  - delete_agent
provides_hooks:
  - pre_llm_call
  - post_llm_call
config_schema:
  inherit_model:
    type: bool
    default: true
    description: New Bots use the model of the profile that asked for them (like Bot Mode's New Agent).
  fallback_model:
    type: dict
    default: {}
    description: "Model block ({default, provider, base_url}) to switch a Bot to when its inherited model can't sign in."
  probe_local_models:
    type: bool
    default: false
    description: If no fallback_model is set, look for a local OpenAI-compatible server (llama.cpp, Ollama, LM Studio) to fall back to.
  allow_delete:
    type: bool
    default: false
    description: >-
      Allow the delete_agent tool to permanently delete a Bot. Off by default: an agent should never be able to
      destroy a Bot and its chats on its own. Even when on, the call must pass the Bot's exact profile name.
  backup_before_delete:
    type: bool
    default: true
    description: Export a Bot to a .tar.gz archive before delete_agent removes it. If that backup fails, the delete is refused.
  allow_secrets:
    type: bool
    default: false
    description: Let share_agent write, and import_agent accept, a template the secret scanner marked BLOCK. Operator-only — the model cannot pass it.
  suggest_connectors:
    type: bool
    default: true
    description: Suggest matching MCP servers from Hermes' own catalog when a Bot is created (suggestion only — connecting an account always needs the user).
  install_gateway:
    type: bool
    default: true
    description: Install and start a background gateway service for each new Bot (systemd/launchd; skipped on Windows).
  ack_tapback:
    type: bool
    default: true
    description: >-
      In the Hermes desktop app, react to the user's own message as the turn runs — 👀 while working, then
      ✅ / ✋ / ⚠️ for how it ended. Placed by the plugin, not left to the model. Desktop sessions only, and it
      needs Settings → Appearance → Message Reactions on.
  ack_reactions:
    type: bool
    default: true
    description: >-
      New Bots begin each reply with one emoji for the state of the request — 👀 started, 💬 answering, ✅ done,
      ✋ needs approval, ⚠️ blocked, ⏳ scheduled — then answer as normal. Works on every surface.
  workspace_survey:
    type: bool
    default: true
    description: >-
      When a Bot is created, read the workspace it was born into — the directory Hermes is running
      in and the repos under it, plus this install's own Bots, skills and plugins — and write where
      it fits into the Bot's memory, so it knows on its first turn instead of asking. Also powers the
      guard that refuses a Bot whose job an existing Bot already does. Read-only and shallow: names,
      git remotes, and the head of a README / AGENTS.md / CLAUDE.md. Never source files.
  workspace_roots:
    type: list
    default: []
    description: >-
      Extra directories the survey may read, replacing the default (the working directory Hermes was
      launched in). Point it at the projects your Bots should know about.
  journal_enabled:
    type: bool
    default: true
    description: Give new Bots an append-only work journal and instructions to record meaningful outcomes, evidence and next steps.
