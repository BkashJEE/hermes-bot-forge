<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141C2E"/>
      <stop offset="60%" stop-color="#0A0E18"/>
      <stop offset="100%" stop-color="#0C1424"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/><stop offset="45%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="halo" cx="22%" cy="44%" r="34%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.38"/><stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#243049" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#halo)"/>

  <!-- bot -->
  <g transform="translate(96,150) scale(0.72)">
    <g fill="url(#skin)"><rect x="246" y="86" width="20" height="46" rx="10"/><circle cx="256" cy="84" r="26"/></g>
    <rect x="112" y="146" width="288" height="232" rx="70" fill="url(#skin)"/>
    <rect x="70" y="220" width="34" height="86" rx="17" fill="url(#skin)"/>
    <rect x="408" y="220" width="34" height="86" rx="17" fill="url(#skin)"/>
    <rect x="146" y="188" width="220" height="148" rx="54" fill="#0B1020" opacity="0.94"/>
    <circle cx="210" cy="258" r="27" fill="#F8FAFC"/><circle cx="302" cy="258" r="27" fill="#F8FAFC"/>
    <circle cx="216" cy="262" r="11" fill="#0B1020"/><circle cx="308" cy="262" r="11" fill="#0B1020"/>
    <path d="M214 302c12 14 72 14 84 0" fill="none" stroke="#F8FAFC" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
  </g>

  <g font-family="Liberation Sans, DejaVu Sans" fill="#F8FAFC">
    <text x="476" y="214" font-size="86" font-weight="bold" letter-spacing="-2">Bot Forge</text>
    <text x="478" y="268" font-size="29" fill="#93A4C0">Say what you need. Your agent builds the whole Bot.</text>
  </g>

  <!-- install line -->
  <g>
    <rect x="478" y="308" width="560" height="68" rx="16" fill="#0E1626" stroke="#2C3A58" stroke-width="2"/>
    <text x="506" y="352" font-family="JetBrainsMono Nerd Font, DejaVu Sans Mono" font-size="27" fill="#7DD3FC">hermes plugins install bot-forge</text>
  </g>

  <!-- pills -->
  <g font-family="Liberation Sans, DejaVu Sans" font-size="23">
    <g>
      <rect x="478" y="410" width="272" height="52" rx="26" fill="#12203A" stroke="#2F4468" stroke-width="2"/>
      <circle cx="506" cy="436" r="7" fill="#34D399"/>
      <text x="524" y="444" fill="#CBD5E1">In the Hermes catalog</text>
    </g>
    <g>
      <rect x="766" y="410" width="150" height="52" rx="26" fill="#12203A" stroke="#2F4468" stroke-width="2"/>
      <circle cx="794" cy="436" r="7" fill="#60A5FA"/>
      <text x="812" y="444" fill="#CBD5E1">14 tools</text>
    </g>
    <g>
      <rect x="932" y="410" width="138" height="52" rx="26" fill="#12203A" stroke="#2F4468" stroke-width="2"/>
      <circle cx="960" cy="436" r="7" fill="#A78BFA"/>
      <text x="978" y="444" fill="#CBD5E1">MIT</text>
    </g>
  </g>

  <text x="478" y="528" font-family="Liberation Sans, DejaVu Sans" font-size="25" fill="#64748B">
    github.com/BkashJEE/hermes-bot-forge
  </text>
</svg>
