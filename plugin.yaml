name: bot-forge
version: 0.19.0
description: Say "make me a <role>" and your Hermes agent builds a complete, working Bot — name, face, SOUL.md, memory, tools, skills, routines, Bot Chat and gateway — tested and rolled back on failure.
author: Bikash Joshi
license: MIT
homepage: https://github.com/BkashJEE/hermes-bot-forge
tags: [bots, bot-mode, profiles, agents, multi-agent, automation]
kind: standalone
requires_hermes: ">=0.21"
# Installed into the environment the plugin runs in. forge.py, manage.py, companion.py
# and tools.py all import yaml; without this declaration the plugin only loads on a
# machine that happens to have PyYAML already, and fails with ModuleNotFoundError
# everywhere else — taking all 15 tools and both hooks with it.
python_dependencies:
  - PyYAML>=6.0,<7
provides_tools:
  - create_agent
  - create_team
  - teach_agent
  - update_agent
  - copy_agent
  - list_agents
  - check_agents
  - check_policies
  - check_install
  - agent_journal
  - ask_agent
  - handoff_agent
  - share_agent
  - import_agent
  - hide_agent
  - delete_agent
provides_hooks:
  - pre_llm_call
  - post_llm_call
config_schema:
  inherit_model:
    type: bool
    default: true
    description: Unless an explicit model is supplied, new Bots use the creator's model (like Bot Mode's New Agent).
  fallback_model:
    type: dict
    default: {}
    description: "Model block ({default, provider, base_url}) to switch a Bot to when its inherited model can't sign in."
  probe_local_models:
    type: bool
    default: false
    description: If no fallback_model is set, look for a local OpenAI-compatible server (llama.cpp, Ollama, LM Studio) to fall back to.
  allow_delete:
    type: bool
    default: false
    description: >-
      Allow the delete_agent tool to permanently delete a Bot. Off by default: an agent should never be able to
      destroy a Bot and its chats on its own. Even when on, the call must pass the Bot's exact profile name.
  backup_before_delete:
    type: bool
    default: true
    description: Export a Bot to a .tar.gz archive before delete_agent removes it. If that backup fails, the delete is refused.
  allow_secrets:
    type: bool
    default: false
    description: Let share_agent write, and import_agent accept, a template the secret scanner marked BLOCK. Operator-only — the model cannot pass it.
  suggest_connectors:
    type: bool
    default: true
    description: Suggest matching MCP servers from Hermes' own catalog when a Bot is created (suggestion only — connecting an account always needs the user).
  install_gateway:
    type: bool
    default: true
    description: >-
      Verify serving by the live host gateway and request a hot-rescan if needed. Install a dedicated
      service only for an already explicitly standalone profile. Unverified topology remains pending;
      never force a second gateway. False skips setup, not host discovery. Skipped on Windows.
  ack_tapback:
    type: bool
    default: true
    description: >-
      In the Hermes desktop app, react to the user's own message as the turn runs — 👀 while working, then
      ✅ / ✋ / ⚠️ for how it ended. Placed by the plugin, not left to the model. Desktop sessions only, and it
      needs Settings → Appearance → Message Reactions on.
  ack_reactions:
    type: bool
    default: true
    description: >-
      New Bots begin each reply with one emoji for the state of the request — 👀 started, 💬 answering, ✅ done,
      ✋ needs approval, ⚠️ blocked, ⏳ scheduled — then answer as normal. Works on every surface.
  workspace_survey:
    type: bool
    default: true
    description: >-
      When a Bot is created, read the workspace it was born into — the directory Hermes is running
      in and the repos under it, plus this install's own Bots, skills and plugins — and write where
      it fits into the Bot's memory, so it knows on its first turn instead of asking. Also powers the
      guard that refuses a Bot whose job an existing Bot already does. Read-only and shallow: names,
      git remotes, and the head of a README / AGENTS.md / CLAUDE.md. Never source files.
  workspace_roots:
    type: list
    default: []
    description: >-
      Extra directories the survey may read, replacing the default (the working directory Hermes was
      launched in). Point it at the projects your Bots should know about.
  bot_screen:
    type: bool
    default: false
    description: >-
      Give every new Bot its own desktop on the gateway host — it browses and clicks on a screen you
      can watch in Hermes Desktop, take over for a login or CAPTCHA, and hand back. Grants
      computer_use and browser. Linux gateway hosts only, and it needs TigerVNC + Xfce
      (`hermes computer-use screen install`) and the cua-driver; creation is refused with the reason
      when the host cannot provide one, rather than making a Bot that cannot see. Off by default:
      a screen costs about 1.1-1.5 GB while it is open. create_agent's own bot_screen argument
      overrides this per Bot.
  adopt_bots:
    type: bool
    default: false
    description: >-
      Opt in to give every profile on this machine the acknowledgement reaction, not only Bots this
      plugin created — one made through Hermes' New Agent dialog or `hermes profile create` behaves
      the same. When true, runs on plugin load, installs the hook into each profile and switches
      Hermes' own Message Reactions setting on there, and does nothing when everything is already
      in place. Off by default: Bot Forge never edits profiles it did not create unless asked.
  inherit_plugins:
    type: list
    default: []
    description: >-
      Plugins from the root profile to copy into every new Bot and enable there, by name; ["all"] for
      every plugin enabled on the root profile. Off by default: `hermes profile create --clone-from`
      copies the root's plugins.enabled list but not the plugin directories, so without this a root
      plugin is enabled-but-inert in a Bot (check_agents flags those). Bot Forge itself is never
      copied, and no .env or credential file travels with a plugin. create_agent's own
      inherit_plugins argument overrides this per Bot. Under ["all"], a plugin that declares
      requires_env is skipped and must be named: those are the ones carrying reach into an account,
      and a Bot should not acquire that silently.
  notify_email:
    type: str
    default: ""
    description: >-
      Email you when a Bot records a blocker, and for the scheduled digest. Leave empty to use
      Hermes' own EMAIL_HOME_ADDRESS, or the address it sends from; set false to switch mail off
      entirely. Sending uses Hermes' existing EMAIL_SMTP_HOST / EMAIL_ADDRESS / EMAIL_PASSWORD —
      there is nothing new to configure. Outbound only: a Bot can mail this address and no other,
      never a recipient from a tool call or a persona, and nothing here ever reads a mailbox.
  notify_blocked:
    type: bool
    default: true
    description: >-
      Send that mail as soon as a Bot journals a blocked or failed entry, instead of waiting for
      you to ask what needs you. Rate limited per Bot so a stuck routine cannot become a mail
      storm, and silently skipped when email is not configured.
  journal_enabled:
    type: bool
    default: true
    description: Give new Bots an append-only work journal and instructions to record meaningful outcomes, evidence and next steps.
