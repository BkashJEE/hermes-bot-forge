name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The OS list here is the claim: tests/test_suite_integrity.py reads it and refuses a
  # platform the skill advertises but this job does not run. Adding a platform to the skill
  # means adding it here, which means actually running the suite there.
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check the plugin manifest parses
        run: python -c "import yaml,sys; m=yaml.safe_load(open('plugin.yaml')); sys.exit(0 if m['name']=='bot-forge' and m['provides_tools'] else 1)"

  # A passing suite proves nothing if the guard under test is inert. Each of these reverts one
  # load-bearing shared-policy decision (or one fix for a defect found in review) and requires
  # the suite to fail. They run the suite repeatedly, so they run once, not across the matrix.
  shared-policy-mutations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Policy decisions — every reverted decision must be caught
        run: python bench/policy_mutation_check.py
      - name: Review fixes — every reverted fix must be caught
        run: python bench/shared_policy_mutation_check.py
      - name: Drift-detector and fence-marker fixes — every reverted fix must be caught
        run: python bench/policy_regression_mutation_check.py

  # The bug class that has cost two releases is the plugin not loading at all, and it always
  # looked like a passing suite: `python -m unittest` runs from inside the checkout, where ''
  # on sys.path resolves a bare `import forge` that Hermes cannot resolve. So load it the way
  # Hermes does — as a package, with the working directory somewhere else entirely — and check
  # that what registers is what plugin.yaml promised.
  loads-like-hermes-loads-it:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: checkout
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only what the plugin declares
        run: pip install pyyaml==6.0.2
      - name: Every declared tool and hook must actually register
        working-directory: /tmp
        run: python -B "$GITHUB_WORKSPACE/checkout/tests/registration_probe.py" "$GITHUB_WORKSPACE/checkout" "$(mktemp -d)"
      - name: The registered CLI command, diagnostic tool and journal callbacks must run
        working-directory: /tmp
        run: python -B "$GITHUB_WORKSPACE/checkout/tests/catalog_callback_probe.py" "$GITHUB_WORKSPACE/checkout" "$(mktemp -d)"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.16.10
      - name: Lint
        run: ruff check --output-format github .
