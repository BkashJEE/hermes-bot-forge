<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A2337"/>
      <stop offset="100%" stop-color="#090D15"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="45%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#tile)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>
  <rect x="4" y="4" width="504" height="504" rx="110" fill="none" stroke="#2D3A57" stroke-width="8"/>

  <!-- antenna -->
  <g fill="url(#skin)">
    <rect x="246" y="86" width="20" height="46" rx="10"/>
    <circle cx="256" cy="84" r="26"/>
  </g>

  <!-- head -->
  <g>
    <rect x="112" y="146" width="288" height="232" rx="70" fill="url(#skin)"/>
    <rect x="70" y="220" width="34" height="86" rx="17" fill="url(#skin)"/>
    <rect x="408" y="220" width="34" height="86" rx="17" fill="url(#skin)"/>
    <!-- visor -->
    <rect x="146" y="188" width="220" height="148" rx="54" fill="#0B1020" opacity="0.92"/>
    <!-- eyes -->
    <circle cx="210" cy="258" r="27" fill="#F8FAFC"/>
    <circle cx="302" cy="258" r="27" fill="#F8FAFC"/>
    <circle cx="216" cy="262" r="11" fill="#0B1020"/>
    <circle cx="308" cy="262" r="11" fill="#0B1020"/>
    <!-- smile -->
    <path d="M214 302c12 14 72 14 84 0" fill="none" stroke="#F8FAFC" stroke-width="12"
          stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- struck from the forge -->
  <path d="M410 384c5 26 9 30 35 35-26 5-30 9-35 35-5-26-9-30-35-35 26-5 30-9 35-35z" fill="#F8FAFC" opacity="0.9"/>
</svg>
