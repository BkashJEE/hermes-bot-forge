<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #070B13;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="16"
      data-width="1080"
      data-height="1080"
    >
      <div
        id="el-01-callback"
        class="scene"
        data-composition-id="01-callback"
        data-composition-src="compositions/frames/01-callback.html"
        data-start="0"
        data-duration="4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-page"
        class="scene"
        data-composition-id="02-page"
        data-composition-src="compositions/frames/02-page.html"
        data-start="3.5"
        data-duration="6.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-command"
        class="scene"
        data-composition-id="03-command"
        data-composition-src="compositions/frames/03-command.html"
        data-start="9.5"
        data-duration="4"
        data-track-index="0"
      ></div>

      <div
        id="el-04-close"
        class="scene"
        data-composition-id="04-close"
        data-composition-src="compositions/frames/04-close.html"
        data-start="13"
        data-duration="3"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-callback", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 3.5);
        tl.fromTo("#el-02-page", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 3.5);
        tl.to("#el-02-page", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 9.5);
        tl.fromTo("#el-03-command", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 9.5);
        tl.to("#el-03-command", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 13);
        tl.fromTo("#el-04-close", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 13);
        tl.to({}, { duration: 16 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
