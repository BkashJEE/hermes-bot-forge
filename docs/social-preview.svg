<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1280" height="640" viewBox="0 0 1280 640" font-family="Liberation Sans, DejaVu Sans">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2F4468" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12203A"/>
      <stop offset="62%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#070A14"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1B2644" stroke-width="1" opacity="0.5"/>
    </pattern>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#637EFF" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#2F2FF2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <ellipse cx="300" cy="330" rx="420" ry="330" fill="url(#glow)"/>

  <!-- The hero artwork stays a referenced file, never traced into paths and never upscaled:
       the PNG is the master and this renders it at its own scale. -->
  <image xlink:href="hero-character.png" x="34" y="38" height="624" width="425"
         preserveAspectRatio="xMidYMid meet"/>

  <text x="508" y="246" font-size="86" font-weight="bold" letter-spacing="-2" fill="#F8FAFC">Bot Forge</text>
  <text x="510" y="300" font-size="29" fill="#93A4C0">Say what you need. Your agent builds the whole Bot.</text>

  <rect x="508" y="334" width="560" height="68" rx="14" fill="#0B1020" stroke="#2F4468" stroke-width="2"/>
  <text x="540" y="377" font-family="JetBrainsMono Nerd Font, DejaVu Sans Mono" font-size="27" fill="#7DD3FC">hermes plugins install bot-forge</text>

  <g font-size="22">
    <rect x="508" y="438" width="286" height="46" rx="23" fill="#12203A" stroke="#2F4468"/>
    <circle cx="534" cy="461" r="7" fill="#34D399"/>
    <text x="552" y="469" fill="#CBD5E1">In the Hermes catalog</text>

    <rect x="808" y="438" width="134" height="46" rx="23" fill="#12203A" stroke="#2F4468"/>
    <circle cx="834" cy="461" r="7" fill="#60A5FA"/>
    <text x="852" y="469" fill="#CBD5E1">17 tools</text>

    <rect x="956" y="438" width="104" height="46" rx="23" fill="#12203A" stroke="#2F4468"/>
    <circle cx="982" cy="461" r="7" fill="#A78BFA"/>
    <text x="1000" y="469" fill="#CBD5E1">MIT</text>
  </g>

  <text x="508" y="542" font-size="23" fill="#64748B">github.com/BkashJEE/hermes-bot-forge</text>
</svg>
