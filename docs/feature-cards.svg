<text x="36" y="188" font-size="46" font-weight="bold" fill="url(#skin)" letter-spacing="-1">Bot Forge</text>
<text x="36" y="228" font-size="23" font-weight="bold" fill="#E2E8F0">Say it. It gets built.</text>
<text x="36" y="272" font-size="20" fill="#8FA1BC">In the Hermes plugin catalog. Open source, MIT.</text>
<rect x="36" y="292" width="430" height="44" rx="12" fill="#0B1220" stroke="#2A3550" stroke-width="2"/>
<text x="56" y="321" font-size="19" font-family="JetBrainsMono Nerd Font, DejaVu Sans Mono" fill="#7DD3FC">hermes plugins install bot-forge</text>
</g>
<g transform="translate(612,28)">
<rect width="560" height="330" rx="26" fill="url(#card)" stroke="#232C42" stroke-width="2"/>
<rect x="36" y="34" width="66" height="66" rx="18" fill="#141D30" stroke="#28334D" stroke-width="2"/>
<g transform="translate(47,45)" fill="url(#skin)"><path d="M20 4c3 12 5 14 17 17-12 3-14 5-17 17-3-12-5-14-17-17 12-3 14-5 17-17z"/></g>
<text x="36" y="152" font-size="30" font-weight="bold" fill="#F1F5F9" letter-spacing="-0.4">One sentence, a whole Bot</text>
<text x="36" y="190" font-size="21" fill="#94A6C2">Name, face, SOUL.md, memory, tools, routines</text>
<text x="36" y="220" font-size="21" fill="#94A6C2">and its own chat.</text>
<rect x="36" y="262" width="154" height="40" rx="12" fill="#111C30" stroke="#2A3A57" stroke-width="2"/>
<circle cx="58" cy="282" r="6" fill="#34D399"/>
<text x="74" y="289" font-size="18" font-weight="bold" fill="#B8C7DE">Zero setup</text>
</g>
<g transform="translate(28,382)">
<rect width="560" height="330" rx="26" fill="url(#card)" stroke="#232C42" stroke-width="2"/>
<rect x="36" y="34" width="66" height="66" rx="18" fill="#141D30" stroke="#28334D" stroke-width="2"/>
<g transform="translate(47,45)" fill="url(#skin)"><circle cx="13" cy="14" r="7"/><circle cx="28" cy="12" r="6"/><path d="M2 38c0-8 5-13 11-13s11 5 11 13z"/><path d="M24 38c0-7 4-11 9-11s9 4 9 11z" opacity=".7"/></g>
<text x="36" y="152" font-size="30" font-weight="bold" fill="#F1F5F9" letter-spacing="-0.4">Hire a whole crew</text>
<text x="36" y="190" font-size="21" fill="#94A6C2">One call builds a lead plus three or four</text>
<text x="36" y="220" font-size="21" fill="#94A6C2">specialists, one job each.</text>
<rect x="36" y="262" width="164" height="40" rx="12" fill="#111C30" stroke="#2A3A57" stroke-width="2"/>
<circle cx="58" cy="282" r="6" fill="#60A5FA"/>
<text x="74" y="289" font-size="18" font-weight="bold" fill="#B8C7DE">create_team</text>
</g>
<g transform="translate(612,382)">
<rect width="560" height="330" rx="26" fill="url(#card)" stroke="#232C42" stroke-width="2"/>
<rect x="36" y="34" width="66" height="66" rx="18" fill="#141D30" stroke="#28334D" stroke-width="2"/>
<g transform="translate(47,45)" fill="url(#skin)"><path d="M22 3a4 4 0 014 4v1c7 2 11 8 11 15v7l4 6H3l4-6v-7c0-7 4-13 11-15V7a4 4 0 014-4z"/><path d="M16 39h12a6 6 0 01-12 0z"/></g>
<text x="36" y="152" font-size="30" font-weight="bold" fill="#F1F5F9" letter-spacing="-0.4">What&#x27;s waiting on you</text>
<text x="36" y="190" font-size="21" fill="#94A6C2">Every Bot blocked on something only you can</text>
<text x="36" y="220" font-size="21" fill="#94A6C2">do, and how long it has sat there.</text>
<rect x="36" y="262" width="164" height="40" rx="12" fill="#111C30" stroke="#2A3A57" stroke-width="2"/>
<circle cx="58" cy="282" r="6" fill="#A78BFA"/>
<text x="74" y="289" font-size="18" font-weight="bold" fill="#B8C7DE">New in 0.11</text>
</g>
<g transform="translate(28,736)">
<rect width="560" height="330" rx="26" fill="url(#card)" stroke="#232C42" stroke-width="2"/>
<rect x="36" y="34" width="66" height="66" rx="18" fill="#141D30" stroke="#28334D" stroke-width="2"/>
<g transform="translate(47,45)" fill="url(#skin)"><path d="M5 9a5 5 0 015-5h24a5 5 0 015 5v18a5 5 0 01-5 5H18l-9 8v-8a4 4 0 01-4-4z"/></g>
<text x="36" y="152" font-size="30" font-weight="bold" fill="#F1F5F9" letter-spacing="-0.4">Manage them by talking</text>
<text x="36" y="190" font-size="21" fill="#94A6C2">Rename, retool, teach, copy or hide a Bot —</text>
<text x="36" y="220" font-size="21" fill="#94A6C2">in chat. No config files.</text>
<rect x="36" y="262" width="184" height="40" rx="12" fill="#111C30" stroke="#2A3A57" stroke-width="2"/>
<circle cx="58" cy="282" r="6" fill="#60A5FA"/>
<text x="74" y="289" font-size="18" font-weight="bold" fill="#B8C7DE">13 more tools</text>
</g>
<g transform="translate(612,736)">
<rect width="560" height="330" rx="26" fill="url(#card)" stroke="#232C42" stroke-width="2"/>
<rect x="36" y="34" width="66" height="66" rx="18" fill="#141D30" stroke="#28334D" stroke-width="2"/>
<g transform="translate(47,45)" fill="url(#skin)"><rect x="4" y="4" width="16" height="16" rx="4"/><rect x="24" y="4" width="16" height="16" rx="4" opacity=".75"/><rect x="4" y="24" width="16" height="16" rx="4" opacity=".75"/><rect x="24" y="24" width="16" height="16" rx="4" opacity=".5"/></g>
<text x="36" y="152" font-size="30" font-weight="bold" fill="#F1F5F9" letter-spacing="-0.4">Starters worth stealing</text>
<text x="36" y="190" font-size="21" fill="#94A6C2">Chief of staff, morning brief, research</text>
<text x="36" y="220" font-size="21" fill="#94A6C2">digest, competitor watch, repo triage.</text>
<rect x="36" y="262" width="164" height="40" rx="12" fill="#111C30" stroke="#2A3A57" stroke-width="2"/>
<circle cx="58" cy="282" r="6" fill="#22D3EE"/>
<text x="74" y="289" font-size="18" font-weight="bold" fill="#B8C7DE">5 templates</text>
</g>
<g transform="translate(28,1090)">
<rect width="560" height="330" rx="26" fill="url(#card)" stroke="#232C42" stroke-width="2"/>
<rect x="36" y="34" width="66" height="66" rx="18" fill="#141D30" stroke="#28334D" stroke-width="2"/>
<g transform="translate(47,45)" fill="url(#skin)"><path d="M22 3l16 6v13c0 11-7 18-16 21C13 40 6 33 6 22V9z"/></g>
<text x="36" y="152" font-size="30" font-weight="bold" fill="#F1F5F9" letter-spacing="-0.4">Its own sandbox</text>
<text x="36" y="190" font-size="21" fill="#94A6C2">A Bot with a shell runs in a container</text>
<text x="36" y="220" font-size="21" fill="#94A6C2">instead of on your machine.</text>
<rect x="36" y="262" width="235" height="40" rx="12" fill="#111C30" stroke="#2A3A57" stroke-width="2"/>
<circle cx="58" cy="282" r="6" fill="#34D399"/>
<text x="74" y="289" font-size="18" font-weight="bold" fill="#B8C7DE">Docker · Apptainer</text>
</g>
<g transform="translate(612,1090)">
<rect width="560" height="330" rx="26" fill="url(#card)" stroke="#232C42" stroke-width="2"/>
<rect x="36" y="34" width="66" height="66" rx="18" fill="#141D30" stroke="#28334D" stroke-width="2"/>
<g transform="translate(47,45)" fill="url(#skin)"><path d="M7 5h20a6 6 0 016 6v28H13a6 6 0 01-6-6z"/><path d="M13 39h24v-6H13a3 3 0 000 6z" opacity=".65"/></g>
<text x="36" y="152" font-size="30" font-weight="bold" fill="#F1F5F9" letter-spacing="-0.4">A journal, not a vibe</text>
<text x="36" y="190" font-size="21" fill="#94A6C2">What it did, the evidence, the next step.</text>
<text x="36" y="220" font-size="21" fill="#94A6C2">Never credentials.</text>
<rect x="36" y="262" width="164" height="40" rx="12" fill="#111C30" stroke="#2A3A57" stroke-width="2"/>
<circle cx="58" cy="282" r="6" fill="#22D3EE"/>
<text x="74" y="289" font-size="18" font-weight="bold" fill="#B8C7DE">Stays local</text>
</g>
<g transform="translate(28,1444)">
<rect width="560" height="330" rx="26" fill="url(#card)" stroke="#232C42" stroke-width="2"/>
<rect x="36" y="34" width="66" height="66" rx="18" fill="#141D30" stroke="#28334D" stroke-width="2"/>
<g transform="translate(47,45)" fill="url(#skin)"><path d="M22 9c10 0 18 7 21 13-3 6-11 13-21 13S4 28 1 22C4 16 12 9 22 9z"/><circle cx="22" cy="22" r="7" fill="#0C1220"/></g>
<text x="36" y="152" font-size="30" font-weight="bold" fill="#F1F5F9" letter-spacing="-0.4">You see it thinking</text>
<text x="36" y="190" font-size="21" fill="#94A6C2">A reaction lands on your own message when a</text>
<text x="36" y="220" font-size="21" fill="#94A6C2">Bot picks it up, and again when it ends.</text>
<rect x="36" y="262" width="194" height="40" rx="12" fill="#111C30" stroke="#2A3A57" stroke-width="2"/>
<circle cx="58" cy="282" r="6" fill="#A78BFA"/>
<text x="74" y="289" font-size="18" font-weight="bold" fill="#B8C7DE">Hermes Desktop</text>
</g>
</svg>